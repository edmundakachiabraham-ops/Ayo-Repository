<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background: #000;
        }
        .rotatingText{
            display: inline-block;
            margin: 50px;
            font-size: 24px;
            color: white;
            animation: spinText 3s linear infinite;
        }
        @keyframes spinText {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="rotatingText">CSS Animation</div>
</body>
</html>
